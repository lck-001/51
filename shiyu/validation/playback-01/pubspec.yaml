name: shiyu_playback_probe
description: Isolated app-owned playback module and Android host validation.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.0
  file_selector: 1.1.0
  path_provider: 2.1.6
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  audio_service: 0.18.19
  audio_session: 0.2.4
  playback_core:
    path: ../../packages/playback_core
dev_dependencies:
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true

dependency_overrides:
  audio_service:
    path: ../../third_party/audio_service
