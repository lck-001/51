# Google MCP Toolbox 配置样例。
# 不同 toolbox 版本对 HTTP/OpenAPI tool 的 schema 支持可能不同。
# 若当前版本不支持 HTTP tool，请用 Python MCP Server 直接暴露 gateway API，
# 或扩展 toolbox 自定义 tool/source。

sources:
  hive_gateway:
    kind: http
    baseUrl: http://127.0.0.1:8088

tools:
  login_hive:
    kind: http
    source: hive_gateway
    method: POST
    path: /api/login
    description: Login to Hive with user supplied credentials. Password must never be logged.

  search_assets:
    kind: http
    source: hive_gateway
    method: POST
    path: /api/assets/search
    description: Search warehouse DDL, DML, SLA result tables, and user profile assets.

  get_table_schema:
    kind: http
    source: hive_gateway
    method: POST
    path: /api/assets/table
    description: Get table schema and partition metadata before generating SQL.

  validate_hive_sql:
    kind: http
    source: hive_gateway
    method: POST
    path: /api/sql/validate
    description: Validate Hive SQL. Only SELECT or WITH SELECT is allowed.

  execute_hive_select:
    kind: http
    source: hive_gateway
    method: POST
    path: /api/sql/execute
    description: Execute a controlled Hive SELECT query with limit, timeout, and concurrency checks.

toolsets:
  hive_query:
    - login_hive
    - search_assets
    - get_table_schema
    - validate_hive_sql
    - execute_hive_select
